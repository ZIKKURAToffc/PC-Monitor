name: Python tests (Linux offscreen)
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 fonts-dejavu-core
      - name: Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Production static analysis
        run: python -m pyflakes *.py
      - name: Unit and Qt offscreen tests
        run: python -m unittest discover -s tests
